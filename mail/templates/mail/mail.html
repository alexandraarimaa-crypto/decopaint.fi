<!doctype html>
<html lang="{{ email_language|default:'fi' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Deco Paint Finland Oy</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
        img { border: 0; display: block; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        a { color: #236c3d; }
        @media only screen and (max-width: 640px) {
            .email-shell { width: 100% !important; border-radius: 0 !important; }
            .email-padding { padding-left: 24px !important; padding-right: 24px !important; }
            .email-logo { width: 100% !important; max-width: 520px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background:#eef3ef; color:#243229; font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
        {% block preheader %}Deco Paint Finland Oy{% endblock %}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; background:#eef3ef;">
        <tr>
            <td align="center" style="padding:28px 12px;">
                <table role="presentation" width="640" cellspacing="0" cellpadding="0" border="0" class="email-shell" style="width:640px; max-width:640px; background:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 12px 30px rgba(22,55,36,.10);">
                    <tr>
                        <td align="center" style="background:#211f20; padding:22px 30px 18px;">
                            <img src="https://decopaint.fi/static/assets/images/email/deco-paint-logo.jpg" width="560" class="email-logo" alt="Deco Paint OIKOS" style="width:560px; max-width:100%; height:auto;">
                        </td>
                    </tr>
                    <tr>
                        <td style="height:6px; background:#00a651; font-size:0; line-height:0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td class="email-padding" style="padding:38px 48px 34px; font-size:16px; line-height:1.65; color:#243229;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td class="email-padding" style="padding:24px 48px 28px; background:#f5f8f5; border-top:1px solid #dce8df; text-align:center; color:#53645a; font-size:12px; line-height:1.65;">
                            <strong style="color:#244735;">Deco Paint Finland Oy</strong><br>
                            <a href="https://maps.app.goo.gl/wo27UgDj9JZRmNYq7" style="color:#53645a;">Asessorinkatu 12, 20780 Kaarina</a><br>
                            <a href="tel:+358400414838" style="color:#53645a;">0400 414 838</a>
                            &nbsp;&middot;&nbsp;
                            <a href="mailto:info@decopaint.fi" style="color:#53645a;">info@decopaint.fi</a>
                            &nbsp;&middot;&nbsp;
                            <a href="https://decopaint.fi/" style="color:#53645a;">decopaint.fi</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
