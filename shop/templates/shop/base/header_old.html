{% load static %}
<header id="header" class="header header-sticky header-sticky-smart disable-transition-all z-index-5">

	<div class="sticky-area">
		<div class="main-header nav navbar bg-body navbar-light navbar-expand-xl py-6 py-xl-0">
			<div class="container-xxl container">
				<div class="d-flex d-xl-none w-100">


					<div class="w-72px d-flex d-xl-none">
						<button class="navbar-toggler align-self-center  border-0 shadow-none px-0 canvas-toggle p-4"
							type="button" data-bs-toggle="offcanvas" data-bs-target="#offCanvasNavBar"
							aria-controls="offCanvasNavBar" aria-expanded="false" aria-label="Toggle Navigation">
							<span class="fs-24 toggle-icon"></span>
						</button>
					</div>

					<div class="d-flex mx-auto">

						<a href="{% url 'shop:main' %}" class="navbar-brand px-8 py-4 mx-auto">
							<img class="light-mode-img" alt="logo decopaint" src="{% static "assets/images/header/deco_logo.png" %}">
						</a>

					</div>
					<div class="icons-actions d-flex justify-content-end w-xl-50 fs-28px text-body-emphasis w-72px d-print-none">
						

						<div class="color-modes position-relative ps-5">
							<a class="bd-theme btn btn-link nav-link dropdown-toggle d-inline-flex align-items-center justify-content-center text-primary p-0 position-relative rounded-circle"
								href="#" aria-expanded="true" data-bs-toggle="dropdown" data-bs-display="static"
								aria-label="Toggle theme (light)">
								<svg class="bi my-1 theme-icon-active">
									<use href="#sun-fill"></use>
								</svg>
							</a>
							<ul class="dropdown-menu dropdown-menu-end fs-14px" data-bs-popper="static">
								<li>
									<button type="button" class="dropdown-item d-flex align-items-center active"
										data-bs-theme-value="light" aria-pressed="true">
										<svg class="bi me-4 opacity-50 theme-icon">
											<use href="#sun-fill"></use>
										</svg>
										Light
										<svg class="bi ms-auto d-none">
											<use href="#check2"></use>
										</svg>
									</button>
								</li>
								<li>
									<button type="button" class="dropdown-item d-flex align-items-center"
										data-bs-theme-value="dark" aria-pressed="false">
										<svg class="bi me-4 opacity-50 theme-icon">
											<use href="#moon-stars-fill"></use>
										</svg>
										Dark
										<svg class="bi ms-auto d-none">
											<use href="#check2"></use>
										</svg>
									</button>
								</li>
								<li>
									<button type="button" class="dropdown-item d-flex align-items-center"
										data-bs-theme-value="auto" aria-pressed="false">
										<svg class="bi me-4 opacity-50 theme-icon">
											<use href="#circle-half"></use>
										</svg>
										Auto
										<svg class="bi ms-auto d-none">
											<use href="#check2"></use>
										</svg>
									</button>
								</li>
							</ul>
						</div>
					</div>
				</div>

				<div class="d-none d-xl-flex flex-column flex-xl-row w-100">
					<div class="w-auto w-xl-50 d-flex align-items-center">
						<div
							class="icons-actions d-none d-xl-flex justify-content-start me-auto fs-28px text-body-emphasis">
							<div class="pe-6">
								
								
							</div>
						</div>
						<ul class="navbar-nav w-100 w-xl-auto">

							<li class="nav-item transition-all-xl-1 py-xl-11 py-0 px-xxl-8 px-xl-6 dropdown dropdown-hover dropdown-fullwidth">
								<a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px"
									href="{% url 'shop:main' %}">Etusivu</a>
							</li>


							<li class="nav-item transition-all-xl-1 py-xl-11 py-0 px-xxl-8 px-xl-6 dropdown dropdown-hover dropdown-fullwidth">
								<a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px"
										href="{% url 'shop:all_products' %}">Kauppa</a>
							</li>


							<li class="nav-item transition-all-xl-1 py-xl-11 py-0 px-xxl-8 px-xl-6 dropdown dropdown-hover dropdown-fullwidth">
								<a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px"
									href="{% url 'shop:b2b' %}">Yritysmyynti</a>
							</li>


						</ul>
					</div>
					<div class="d-none d-xl-flex align-items-center ">

						<a href="{% url 'shop:main' %}" class="navbar-brand px-8 py-4 mx-auto">
							<img class="light-mode-img" alt="logo decopaint" src="{% static "assets/images/header/deco_logo.png" %}">
						</a>

					</div>
					<div class="w-auto w-xl-50 d-flex align-items-center">
						<ul class="navbar-nav w-100 w-xl-auto">

							<li class="nav-item transition-all-xl-1 py-xl-11 py-0 px-xxl-8 px-xl-6 dropdown dropdown-hover dropdown-fullwidth">
								<a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px"
									href="{% url 'shop:delivery' %}">Yleiset käyttöehdot </a>
							</li>

							<li class="nav-item transition-all-xl-1 py-xl-11 py-0 px-xxl-8 px-xl-6 dropdown dropdown-hover dropdown-fullwidth">
								<a class="nav-link d-flex justify-content-between position-relative py-xl-0 px-xl-0 text-uppercase fw-semibold ls-1 fs-15px fs-xl-14px"
									href="{% url 'shop:contact' %}">Yhteys</a>
							</li>
							
						</ul>


						<div class="icons-actions d-none d-xl-flex justify-content-end ms-auto fs-28px text-body-emphasis">

						
							<div class="px-5 d-none d-xl-inline-block">
								{% if request.user.is_authenticated %}
									<a href="{% url 'user:profile' %}">
										<svg class="icon icon-user-light">
											<use xlink:href="#icon-user-light"></use>
										</svg>
									</a>
								{% else %}
									<a class="lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="modal"
									data-bs-target="#signInModal">
										<svg class="icon icon-user-light">
											<use xlink:href="#icon-user-light"></use>
										</svg>
									</a>
								{% endif %}
							</div>

							<div class="px-5 d-none d-xl-inline-block">
								<a class="position-relative lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="offcanvas" data-bs-target="#shoppingCart" aria-controls="shoppingCart" aria-expanded="false">
									<svg class="icon icon-star-light">
										<use xlink:href="#icon-shopping-bag-open-light"></use>
									</svg>{% csrf_token %}
									{% with total_items=cart|length %}
									{% if cart|length > 0 %}
									<span class="badge bg-dark text-white position-absolute top-0 start-100 translate-middle mt-4 rounded-circle fs-13px p-0 square" style="--square-size: 18px">
										{{ total_items }}
									</span>
									{% endif %}
									{% endwith %}
								</a>
							</div>

							<div class="px-xl-5 d-inline-block">
								<a class="lh-1 color-inherit text-decoration-none" href="#" data-bs-toggle="offcanvas"
									data-bs-target="#searchModal" aria-controls="searchModal" aria-expanded="false">
									<svg class="icon icon-magnifying-glass-light">
										<use xlink:href="#icon-magnifying-glass-light"></use>
									</svg>
								</a>
							</div>

							<script>
								$(document).ready(function () {
									// Function to update cart content via AJAX
									function updateCartContent() {
										console.log("update");
										// AJAX request to get cart data
										var csrfToken = document.getElementsByName('csrfmiddlewaretoken')[0].value;

										// Make an asynchronous request to get cart data
										var xhr = new XMLHttpRequest();
										xhr.open('POST', '{% url "shop:get_cart_data" %}', true);

										// Set the CSRF token in the request headers
										xhr.setRequestHeader('Content-Type', 'application/json');
										xhr.setRequestHeader('X-CSRFToken', csrfToken);
										xhr.responseType = 'text';

										// Set up the event handler to handle the response
										xhr.onload = function () {
											if (xhr.status === 200) {
												// Check if the response is JSON
												if (xhr.getResponseHeader('content-type').toLowerCase().includes('application/json')) {
													try {
														var response = JSON.parse(xhr.responseText);
														document.getElementById('shoppingCart').innerHTML = responseToHtml(response);
													} catch (e) {
														console.error('Error parsing JSON:', e);
														// Display an error message or handle it in another way
														document.getElementById('shoppingCart').innerHTML = '<p>Error loading data</p>';
													}
												} else {
													// If the response is not JSON, it's likely HTML
													document.getElementById('shoppingCart').innerHTML = xhr.responseText;
												}
											} else {
												console.error('Error:', xhr.statusText);
												// Display an error message or handle it in another way
												document.getElementById('shoppingCart').innerHTML = '<p>Error loading data</p>';
											}
										};

										// Send the request
										xhr.send();
									}
							
									// Bind the updateCartContent function to the modal shown event
									$('#shoppingCart').on('show.bs.offcanvas', function (e) {
										// Update cart content when the modal is fully shown
										updateCartContent();
									});
							
								});
							</script>
							
							
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</header>
