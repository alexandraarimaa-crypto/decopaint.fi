{% for review in reviews %}
    <div class="border-bottom pb-7 pt-10">
        <div class="">
            <h5 class="mt-0 mb-4 fs-14px text-uppercase ls-1">{{ review.name }}</h5>
        </div>
        <div class="d-flex align-items-center mb-6">
            <div class="d-flex align-items-center fs-15px ls-0">
                <div class="rating">
                    <div class="empty-stars">
                        {% for _ in '12345' %}
                        <span class="star">
                            <svg class="icon star-o">
                                <use xlink:href="#star-o"></use>
                            </svg>
                        </span>
                        {% endfor %}
                    </div>
                    <div class="filled-stars" style="width: {{ review.get_rating_percent }}%">
                        {% for _ in '12345' %}
                        <span class="star">
                            <svg class="icon star text-primary">
                                <use xlink:href="#star"></use>
                            </svg>
                        </span>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <span class="fs-3px mx-5"><i class="fas fa-circle"></i></span>
            <span class="fs-14">{{ review.created }}</span>
        </div>

        <div class="d-flex justify-content-start align-items-center mb-5">
            
            
        </div>
        {% if review.title %}<p class="fw-semibold fs-6 text-body-emphasis mb-5">{{ review.title }}</p>{% endif %}
        <p class="mb-10 fs-6">{{ review.text }}</p>
        {% if review.thumbnail %}
            <a href="{{ review.image.url }}" data-gallery="review{{ review.id }}">
                <img src="{{ review.thumbnail.url }}" alt="review" data-src="{{ review.thumbnail.url }}"
                    class="img-fluid lazy-image bg-light rounded" width="120" height="120">
            </a>
        {% endif %}

    </div>
{% endfor %}
